<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluxo de dados do CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#f5f4f0;color:#1a1916;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:6px;padding-left:14px;border-left:4px solid #E30613;transition:border-color .2s}
.caps{display:flex;gap:4px}
.ct{padding:5px 13px;border-radius:7px;border:1px solid #d3d1c7;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:#636057}
.ct.amc{background:#fff0f0;color:#a80000;border-color:#E30613}
.ct.asm{background:#fffae6;color:#7a5200;border-color:#F9AE00}
.ct.asv{background:#fff5e6;color:#7a3800;border-color:#FF7C07}
.tabs{display:flex;gap:4px;margin-bottom:.8rem;flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:7px;border:1px solid #d3d1c7;background:#fff;cursor:pointer;font-size:12px;color:#636057}
.tab.on{background:#1a1916;color:#fff;font-weight:500;border-color:#1a1916}

.sec{display:none}.sec.on{display:block}
.src{font-size:10px;color:#888780;background:#f0efe9;border:1px solid #d3d1c7;border-radius:6px;padding:6px 10px;margin-bottom:.8rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src strong{color:#636057}
.upd{margin-left:auto;background:#EAF3DE;border:1px solid #1D9E7544;border-radius:99px;font-size:10px;font-weight:600;color:#0e6647;padding:2px 8px;white-space:nowrap}
.fb{display:flex;align-items:center;gap:4px;margin-bottom:.8rem;padding:5px 9px;background:#eeeee8;border-radius:7px;overflow-x:auto}
.fb label{font-size:10px;color:#636057;white-space:nowrap;flex-shrink:0}
.fb select,.fb input[type=date]{font-size:11px;padding:2px 5px;border-radius:5px;border:1px solid #d3d1c7;background:#fff;height:22px;flex-shrink:0}
.fb select{width:80px}.fb input[type=date]{width:105px}
.fb button{font-size:10px;padding:2px 8px;height:22px;border:1px solid #d3d1c7;border-radius:5px;background:#fff;cursor:pointer;flex-shrink:0}
.fsep{width:1px;height:14px;background:#d3d1c7;margin:0 2px;flex-shrink:0}
.ch-hdr{font-size:12px;font-weight:600;color:#636057;margin:.7rem 0 5px;display:flex;align-items:center;gap:5px}
.dot8{width:7px;height:7px;border-radius:50%}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.mk{background:#eeeee8;border-radius:7px;padding:9px 11px}
.ml{font-size:10px;color:#636057;margin-bottom:2px}
.mv{font-size:17px;font-weight:600;color:var(--cap-col,#1a1916)}
.ms{font-size:10px;margin-top:1px;line-height:1.3}
.up{color:#1D9E75}.dn{color:#D85A30}.neu{color:#888780}
.card{background:#fff;border:1px solid #e8e6e0;border-radius:9px;padding:.85rem 1rem;margin-bottom:.8rem}
.ct2{font-size:12px;font-weight:600;color:#636057;margin-bottom:7px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem;margin-bottom:.8rem}
.cw{width:100%}
.leg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:5px;font-size:11px;color:#636057}
.leg span{display:flex;align-items:center;gap:3px}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
th{text-align:left;padding:5px 7px;font-size:10px;font-weight:600;color:#636057;border-bottom:1px solid #e8e6e0;background:#f9f8f5}
td{padding:5px 7px;border-bottom:1px solid #e8e6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.hi td:first-child{color:#1D9E75;font-weight:600}
tr.lo td:first-child{color:#D85A30}
tr.total-row td{font-weight:700;background:#f5f4f0;border-top:1px solid #d3d1c7}
.ir{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #e8e6e0}
.ir:last-child{border-bottom:none}
.ii{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.nb{font-size:11px;color:#636057;background:#eeeee8;padding:7px 10px;border-radius:7px;margin-bottom:.8rem;line-height:1.6}
.nb.alert{background:#FFF0EE;border:1px solid #D85A3055;color:#7a1f0e}
.nb.warn{background:#FFF8EC;border:1px solid #EF9F2755;color:#7a5200}
.nb.ok{background:#EAF3DE;border:1px solid #1D9E7544;color:#0e6647}
.cy{margin-bottom:6px}
.cyn{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px}
.cyb{background:#eeeee8;border-radius:99px;height:4px;overflow:hidden}
.cbf{height:100%;border-radius:99px}
.catbadge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;font-weight:600;white-space:nowrap}
/* funil em pé */
.vfunnel{display:flex;flex-direction:column;gap:0;max-width:480px;margin:0 auto}
.vf-step{display:flex;align-items:center;gap:8px}
.vf-bar-wrap{flex:1;display:flex;align-items:center;gap:6px}
.vf-bar-bg{flex:1;background:#eeeee8;border-radius:5px;height:26px;overflow:hidden;position:relative}
.vf-bar-fill{height:100%;border-radius:5px;display:flex;align-items:center;padding:0 8px;min-width:40px;transition:width .3s}
.vf-bar-txt{font-size:10px;font-weight:700;color:#fff;white-space:nowrap}
.vf-lbl{font-size:10px;color:#636057;min-width:90px;text-align:right;flex-shrink:0}
.vf-val{font-size:11px;font-weight:600;min-width:55px;text-align:left;flex-shrink:0}
.vf-arrow{padding:2px 0 2px 98px;font-size:10px;color:#888780;display:flex;align-items:center;gap:4px}
.vf-arrow span{background:#eeeee8;border-radius:99px;padding:1px 7px;font-size:10px;font-weight:600}
/* cr */
.cr{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #e8e6e0}
.cr:last-child{border-bottom:none}
.cnm{font-size:11px;min-width:90px;font-weight:600}
.cbw{flex:1;background:#eeeee8;border-radius:99px;height:5px;overflow:hidden}
.cvl{font-size:11px;min-width:60px;text-align:right;color:#636057}
/* base */
.ptabs{display:flex;gap:3px;margin-bottom:.7rem;flex-wrap:wrap}
.ptab{padding:3px 10px;border-radius:5px;border:1px solid #d3d1c7;cursor:pointer;font-size:11px;color:#636057;background:#fff}
.ptab.on{background:#1a1916;color:#fff;font-weight:600;border-color:#1a1916}
.bfs{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid #e8e6e0}
.bfs:last-child{border-bottom:none}
.bfs-ico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.bfs-lbl{flex:1}.bfs-t{font-size:12px;font-weight:600}.bfs-s{font-size:10px;color:#636057}
.bfs-v{font-size:15px;font-weight:700;min-width:65px;text-align:right}
.bfs-p{font-size:10px;color:#888780;min-width:36px;text-align:right}
/* retenção */
.ret-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #e8e6e0}
.ret-row:last-child{border-bottom:none}
.ret-label{font-size:11px;min-width:125px;color:#636057}
.ret-bw{flex:1;background:#eeeee8;border-radius:99px;height:20px;overflow:hidden}
.ret-bf{height:100%;border-radius:99px;display:flex;align-items:center;padding-left:9px}
.ret-bt{font-size:10px;font-weight:700;color:#fff;white-space:nowrap}
.ret-val{font-size:13px;font-weight:700;min-width:40px;text-align:right}
.comp-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
/* sankey */
.sankey{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.sk-col{display:flex;flex-direction:column;gap:5px;flex:1;min-width:95px}
.sk-block{border-radius:8px;padding:10px 12px;text-align:center}
.sk-val{font-size:18px;font-weight:700;display:block}
.sk-lbl{font-size:10px;line-height:1.3;display:block;margin-top:2px;opacity:.8}
.sk-pct{font-size:12px;font-weight:700;display:block;margin-top:3px}
.sk-arr{font-size:20px;color:#888780;flex-shrink:0;align-self:center}
/* metas */
.meta-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.meta-ok{background:#EAF3DE;color:#0e6647}
.meta-over{background:#E6F1FB;color:#0C447C}
.meta-miss{background:#FFF0EE;color:#7a1f0e}
.meta-na{background:#eeeee8;color:#888780}
.month-hdr{font-size:12px;font-weight:700;padding:6px 0;margin-bottom:6px;border-bottom:2px solid #d3d1c7;display:flex;justify-content:space-between;align-items:center}
/* jornada */
.jornada-step{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e8e6e0}
.jornada-step:last-child{border-bottom:none}
.jornada-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:#fff}
.jornada-info{flex:1}
.jornada-title{font-size:12px;font-weight:600}
.jornada-sub{font-size:10px;color:#636057;margin-top:2px}
.jornada-val{font-size:15px;font-weight:700;min-width:60px;text-align:right}
.tab.ed5tab.on{background:#EF9F27 !important;border-color:#EF9F27 !important;color:#fff !important}
.tab.saldotab.on{background:#c47a00 !important;border-color:#c47a00 !important;color:#fff !important}

.dp-acao{background:#f8f7f4;border:1px solid #ece9e2;border-left:3px solid var(--dpc,#c9c6bd);border-radius:8px;padding:10px 12px;transition:box-shadow .15s,transform .15s,background .15s}
.dp-acao:hover{background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.07);transform:translateY(-1px)}
.dp-acao-off{opacity:.75}
.dp-acao-off:hover{background:#f8f7f4;box-shadow:none;transform:none}
.dp-acao-on{background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.10)}
.dp-chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.03em}

body{padding:0;margin:0;background:#faf9f6}
.pg{max-width:1180px;margin:0 auto;padding:26px 16px 40px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.pg-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pg-brand{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#a29f97}
