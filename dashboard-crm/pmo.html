async function pmoLoad(){
  try{
    var res = await fetch(PMO_URL);
    var text = await res.text();
    if(text && text !== '{}'){
      var data = JSON.parse(text);
      if(Array.isArray(data)){
        data.forEach(function(sem, si){
          if(PMO.semanas[si]){
            sem.acoes.forEach(function(a, ai){
              if(PMO.semanas[si].acoes[ai]){
                PMO.semanas[si].acoes[ai].comentarios = a.comentarios || [];
                PMO.semanas[si].acoes[ai].historico = a.historico || [];
                PMO.semanas[si].acoes[ai].status = a.status || PMO.semanas[si].acoes[ai].status;
              }
            });
          }
        });
      }
    }
  } catch(e){ console.warn('pmoLoad error:', e); }
}
async function pmoSave(){
  try{
    var form = new FormData();
    form.append('data', JSON.stringify(PMO.semanas));
    await fetch(PMO_URL, {method:'POST', body:form, mode:'no-cors'});
  } catch(e){ console.warn('pmoSave error:', e); }
}
function pmoToggle(id){
  var el = document.getElementById(id);
  if(el) el.style.display = el.style.display==='none'?'block':'none';
}
async function pmoSetStatus(acaoId, novoStatus){
  PMO.semanas.forEach(function(s){
    s.acoes.forEach(function(a){
      if(a.id===acaoId){
        var old = a.status;
        a.status = novoStatus;
        var ts = new Date().toLocaleDateString('pt-BR');
        var statusLabels = {em_andamento:'Em andamento',planejado:'Planejado',concluido:'Concluído',bloqueado:'Bloqueado'};
        a.historico.push(ts+' — Status alterado de "'+statusLabels[old]+'" para "'+statusLabels[novoStatus]+'"');
      }
    });
  });
  await pmoSave();
  rPMO();
}
async function pmoAddComment(acaoId){
  var inp = document.getElementById('inp-'+acaoId);
  if(!inp || !inp.value.trim()) return;
  var ts = new Date().toLocaleDateString('pt-BR');
  var txt = inp.value.trim();
  inp.value = '';
  PMO.semanas.forEach(function(s){
    s.acoes.forEach(function(a){
      if(a.id===acaoId){
        a.comentarios.push(ts+' — '+txt);
        a.historico.push(ts+' — Comentário adicionado');
      }
    });
  });
  await pmoSave();
  rPMO();
}

      out += '</div>';
      out += '</div></div>';
